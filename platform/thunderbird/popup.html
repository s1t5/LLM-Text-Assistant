<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 8px;
      min-width: 220px;
      background: #fff;
    }
    .action-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      color: #2c3e50;
    }
    .action-item:hover {
      background: #f0f0f0;
    }
    .action-item .emoji {
      font-size: 16px;
    }
    .action-item .shortcut {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }
    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 6px 0;
    }
    .section-title {
      font-size: 12px;
      color: #888;
      padding: 4px 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="actions"></div>
  <script src="popup.js"></script>
</body>
</html>
