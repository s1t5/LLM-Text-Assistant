# Release browser extension
#
# Two jobs:
#   test    — runs on every push: node syntax checks (via tools/build.mjs
#             validation) and the unit test suites (test-*.js).
#   release — runs only when a push to main carries a manifest.json version
#             that has no matching release yet: builds the three store
#             packages and publishes the GitHub release.
#
# Release details:
# - Release (and tag) name equal the manifest version exactly (x.y.z, no
#   "v" prefix), matching the artifact scheme <version>-<target>.<ext>.
# - Packages are built FRESH from the trunk + platform overlays by
#   tools/build.mjs, which also validates everything (JS syntax, locale
#   key parity, version format, overlay completeness) and injects the
#   root manifest version into the Firefox and Thunderbird manifests —
#   the version lives in ONE place: manifest.json in the repo root.
# - The version-bump commit is tagged IN GITEA, in the same push as the
#   commit. Reason: this repo is the Gitea push-mirror source, and the
#   mirror PRUNES refs that only exist on the GitHub side — a tag created
#   only on GitHub (as `gh release create` does when no tag exists) is
#   deleted again on the next mirror sync, turning the release into a
#   hidden draft. A tag that arrives mirrored cannot be pruned. The
#   release therefore attaches to the existing mirrored tag; if the tag
#   has not arrived yet, --target creates it at the same commit (same SHA
#   → the later mirror sync is a no-op, nothing is pruned).
# - If the release already exists (re-pushed fix commits without a version
#   bump, or a partially completed earlier run), the job exits
#   successfully without creating a duplicate.
#
# Runs on the GitHub mirror (github.com/s1t5/LLM-Text-Assistant), which
# Gitea syncs on every commit.

name: Release browser extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unit tests (test-*.js)
        run: |
          fails=0
          for t in test-*.js; do
            echo "::group::$t"
            node "$t" || fails=1
            echo "::endgroup::"
          done
          if [ "$fails" != "0" ]; then
            echo "::error::unit tests failed"
            exit 1
          fi
          echo "All test suites passed."

      - name: Store install check (fresh-install boot + seeded defaults)
        run: |
          node tools/build.mjs --no-zip
          node tools/store-boot-check.js

      - name: Chrome load check (the extension must actually load)
        run: |
          node tools/build.mjs --no-zip
          if python3 tools/chrome-load-check.py build/chrome; then
            echo "Extension loads in Chrome."
          else
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::No usable Chrome on this runner — load check skipped."
            else
              echo "::error::Chrome refused to load the built extension (see log above)."
              exit 1
            fi
          fi

      - name: Build validation (all targets, no packaging)
        run: |
          node tools/build.mjs --no-zip

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect unreleased version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version '$VERSION' is not in x.y.z format"
            exit 1
          fi

          # Skip when a release for this version already exists (published
          # or draft) — re-pushed fix commits without a version bump, or a
          # partially completed earlier run.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version $VERSION detected — building release."
          fi

      - name: Build packages (trunk + platform overlays)
        if: steps.version.outputs.changed == 'true'
        run: |
          node tools/build.mjs

      - name: Verify packages
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for f in "dist/${VERSION}-chrome.zip" "dist/${VERSION}-firefox.zip" "dist/${VERSION}-thunderbird.xpi"; do
            test -f "$f" || { echo "::error::$f was not built"; exit 1; }
            PKG_VERSION=$(unzip -p "$f" manifest.json | jq -r '.version')
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::$f carries version $PKG_VERSION, expected $VERSION"
              exit 1
            fi
          done

          # The Thunderbird package must contain the compose toolbar popup
          unzip -l "dist/${VERSION}-thunderbird.xpi" | grep -q "popup.html" \
            || { echo "::error::popup.html missing in the Thunderbird package"; exit 1; }

          echo "Packages verified:"
          ls -l dist/

      - name: Create release with assets
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The version-bump commit carries a Gitea-side tag of the same
          # name, which the push mirror replicates. When it has arrived,
          # the release attaches to it; --target only matters when the
          # mirror sync is still in flight (same SHA either way).
          gh release create "$VERSION" \
            --title="$VERSION" \
            --target="$GITHUB_SHA" \
            --generate-notes \
            "dist/${VERSION}-chrome.zip" \
            "dist/${VERSION}-firefox.zip" \
            "dist/${VERSION}-thunderbird.xpi"

      - name: Ensure release is published (not a draft)
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Safety net: if the release ended up as a draft for any reason,
          # publish it explicitly so the packages are downloadable.
          if [ "$(gh release view "$VERSION" --json isDraft -q .isDraft)" = "true" ]; then
            echo "Release $VERSION was created as a draft — publishing it now."
            gh release edit "$VERSION" --draft=false
          fi
          echo "Release $VERSION isDraft: $(gh release view "$VERSION" --json isDraft -q .isDraft)"